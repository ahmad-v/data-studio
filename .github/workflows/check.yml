name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Keep the existing primary required-check context stable while making it a
    # quick Linux x64 check. Other native targets run in native.yml.
    name: Rust (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify source and documentation changes
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          code_changed=true
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
            code_changed=false
          elif [[ "$EVENT_NAME" == push && "$PUSH_BASE" != 0000000000000000000000000000000000000000 ]]; then
            base="$PUSH_BASE"
            code_changed=false
          else
            base=""
          fi

          if [[ -n "$base" ]]; then
            while IFS= read -r path; do
              [[ -z "$path" ]] && continue
              case "$path" in
                *.md|docs/*) ;;
                *) code_changed=true; break ;;
              esac
            done < <(git diff --name-only --no-renames "$base" "$HEAD_SHA")
          fi
          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          echo "Code build required: $code_changed"

      - name: Validate capability registry and workflow YAML
        env:
          BASE_SHA: ${{ steps.scope.outputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 -m json.tool docs/capabilities.json >/dev/null
          ruby -e 'require "yaml"; ARGV.each { |path| YAML.parse_file(path) }' .github/workflows/*.yml
          if [[ -n "$BASE_SHA" ]]; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff --check HEAD^ HEAD
          fi

      - name: Install Linux GUI build prerequisites
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        if: steps.scope.outputs.code_changed == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-debug-default-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-rust-${{ hashFiles('rust-toolchain.toml') }}-debug-default-

      - name: Verify locked manifest and dependencies
        if: steps.scope.outputs.code_changed == 'true'
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null

      - name: Verify formatting and locked all-target compilation
        if: steps.scope.outputs.code_changed == 'true'
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets

      - name: Run locked unit and integration tests
        if: steps.scope.outputs.code_changed == 'true'
        run: cargo test --locked

      - name: Run strict Clippy
        if: steps.scope.outputs.code_changed == 'true'
        run: cargo clippy --locked --all-targets -- -D warnings
