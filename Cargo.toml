[package]
name = "data-studio"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.85"
description = "Local tabular data workbench"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
localwright-core = { path = "../localwright/crates/localwright-core", version = "=0.1.0-alpha.1" }
localwright-ui = { path = "../localwright/crates/localwright-ui", version = "=0.1.0-alpha.1", optional = true }
serde_json = "=1.0.140"
csv = "=1.3.1"
calamine = "=0.26.1"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
arrow-array = "=54.3.1"
arrow-schema = "=54.3.1"
parquet = { version = "=54.3.1", default-features = false, features = ["arrow"] }


[features]
default = ["gui"]
gui = ["dep:localwright-ui"]

[dev-dependencies]
tempfile = "=3.19.1"
