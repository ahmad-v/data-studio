[package]
name = "data-studio"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.95"
description = "Local tabular data workbench"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
localwright-core = { git = "https://github.com/ahmad-v/localwright", rev = "b67e0458cc6ce1e9629a94fd3719debdb05d041f", version = "=0.1.0", features = ["figure-pdf"] }
localwright-ui = { git = "https://github.com/ahmad-v/localwright", rev = "b67e0458cc6ce1e9629a94fd3719debdb05d041f", version = "=0.1.0", optional = true }
serde = { version = "=1.0.221", features = ["derive"] }
serde_json = "=1.0.140"
csv = "=1.3.1"
calamine = "=0.38.0"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
arrow-array = "=57.3.3"
arrow-cast = "=57.3.3"
arrow-schema = "=57.3.3"
parquet = { version = "=57.3.3", default-features = false, features = ["arrow"] }
bytes = "=1.12.2"
rusqlite = { version = "=0.43.0", default-features = false, features = ["bundled", "hooks", "limits"] }


[features]
default = ["gui"]
gui = ["dep:localwright-ui"]

[dev-dependencies]
tempfile = "=3.19.1"
