[package]
name = "data-studio"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
description = "Local tabular data workbench"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
localwright-core = { git = "https://github.com/ahmad-v/localwright", rev = "019bdc79535280d4f1fa723878192849fe8fb5dc", version = "=0.1.0-alpha.1" }
localwright-ui = { git = "https://github.com/ahmad-v/localwright", rev = "019bdc79535280d4f1fa723878192849fe8fb5dc", version = "=0.1.0-alpha.1", optional = true }
serde_json = "=1.0.140"
csv = "=1.3.1"
calamine = "=0.38.0"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
arrow-array = "=57.3.3"
arrow-schema = "=57.3.3"
parquet = { version = "=57.3.3", default-features = false, features = ["arrow"] }
bytes = "=1.12.2"


[features]
default = ["gui"]
gui = ["dep:localwright-ui"]

[dev-dependencies]
tempfile = "=3.19.1"
